version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

    - errorlint
    - errname
    - nilerr
    - nilnesserr
    - nilnil
    - errchkjson

    - asasalint
    - bidichk
    - copyloopvar
    - durationcheck
    - exhaustive
    - forcetypeassert
    - gocheckcompilerdirectives
    - gosec
    - makezero
    - musttag
    - reassign
    - recvcheck
    - wastedassign

    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - fatcontext
    - noctx

    - dogsled
    - dupword
    - exptostd
    - gochecknoinits
    - goconst
    - gocritic
    - godot
    - goprintffuncname
    - inamedparam
    - intrange
    - mirror
    - misspell
    - modernize
    - nakedret
    - nosprintfhostport
    - perfsprint
    - predeclared
    - revive
    - unconvert
    - unparam
    - usestdlibvars
    - whitespace

    - testifylint
    - thelper
    - usetesting

    - nolintlint

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true

    exhaustive:
      default-signifies-exhaustive: true

    goconst:
      min-occurrences: 3
      ignore-tests: true

    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style

    godot:
      scope: declarations

    govet:
      enable-all: true
      disable:
        # Field order is optimized for readability.
        - fieldalignment

    misspell:
      locale: US

    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false

    testifylint:
      # Pin the rule set so upgrades cannot silently change it.
      enable:
        - blank-import
        - bool-compare
        - compares
        - contains
        - empty
        - encoded-compare
        - error-is-as
        - error-nil
        - expected-actual
        - float-compare
        - formatter
        - go-require
        - len
        - negative-positive
        - nil-compare
        - regexp
        - require-error
        - suite-broken-parallel
        - suite-dont-use-pkg
        - suite-extra-assert-call
        - suite-method-signature
        - suite-subtest-run
        - suite-thelper
        - useless-assert

    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming

  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      # Test helpers operate only on fixtures they create.
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
