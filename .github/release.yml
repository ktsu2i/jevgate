changelog:
  exclude:
    labels:
      - tagpr
  categories:
    - title: Breaking changes
      labels:
        - breaking-change
    - title: New features
      labels:
        - enhancement
    - title: Fixes
      labels:
        - bug
    - title: Dependency updates
      labels:
        - dependencies
    - title: Other changes
      labels:
        - "*"
